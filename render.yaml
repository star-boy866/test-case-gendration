# Render Blueprint Configuration
# Deploying backend via Docker provides LibreOffice + fonts + Python runtime for genuine Tier 2 document-page rendering.

services:
  - type: web
    name: test-case-gendration
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production

  - type: web
    name: cognos-test-case-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

