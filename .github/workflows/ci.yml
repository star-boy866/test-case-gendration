name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install Linting & Security Tools
      run: pip install ruff bandit safety
    - name: Run Ruff Linting
      run: ruff check backend/
      continue-on-error: true # For Phase 9.7 transition, don't hard fail immediately on legacy formatting
    - name: Run Bandit (SAST)
      run: bandit -r backend/app/ -c "bandit.yaml" || echo "Bandit found potential issues."
    - name: Check Dependencies (Safety)
      run: safety check -r backend/requirements.txt || echo "Vulnerabilities found"

  backend-tests:
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    # 1. Standard Unit & Integration
    - name: Run Pytest (General)
      env:
        PYTHONPATH: backend
        APP_ENV: testing
      run: pytest backend/tests/ -v -k "not test_ast and not test_golden"
      
    # 2. AST Release Gate
    - name: AST Regression Gate
      env:
        PYTHONPATH: backend
        APP_ENV: testing
      run: pytest backend/tests/test_ast_builder.py -v
      
    # 3. Golden Regression Release Gate
    - name: Golden Regression Gate
      env:
        PYTHONPATH: backend
        APP_ENV: testing
      run: pytest backend/tests/test_golden_regression.py -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install NPM dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
    - uses: actions/checkout@v4
    - name: Build Backend Image
      run: docker build -t healthcare-api:test -f backend/Dockerfile backend/
    - name: Build Frontend Image
      run: docker build -t healthcare-ui:test -f frontend/Dockerfile frontend/
